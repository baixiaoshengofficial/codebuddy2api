services:
  codebuddy2api:
    # 默认直接使用 Docker Hub 发布的最新版；源码构建见 docker-compose.build.yml。
    image: knighttools/codebuddy2api:latest
    pull_policy: always
    # 容器的重启策略
    restart: unless-stopped
    # 将容器的 8001 端口映射到宿主机的 8001 端口
    ports:
      - "${CODEBUDDY_PORT:-8001}:${CODEBUDDY_PORT:-8001}"
    # 数据卷挂载，用于持久化配置和凭证
    volumes:
      # 挂载整个配置目录，保留设置和请求数据库。
      - ./config:/app/config
      # 将本地的凭证目录挂载到容器内，实现凭证持久化
      - ./.codebuddy_creds:/app/.codebuddy_creds
      - ./.workbuddy_creds:/app/.workbuddy_creds
    # 加载 .env 文件中的环境变量
    env_file:
      - .env
    environment:
      CODEBUDDY_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "codebuddy2api", "healthcheck"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
